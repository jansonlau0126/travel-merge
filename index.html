<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5eb8e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>環遊合併 — 載具進化幻想</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" data-bg="home">
    <!-- Soft-blur scenic app background (per-landmark scenicBg) -->
    <div id="app-bg" class="app-bg" aria-hidden="true"></div>
    <!-- Landmark scene strip (before→after decoration meta) -->
    <div id="landmark-scene" class="landmark-scene" data-id="home" data-stage="1" aria-hidden="true">
      <div class="scene-layer scene-before" id="scene-before"></div>
      <div class="scene-layer scene-after" id="scene-after"></div>
      <div class="scene-glow" aria-hidden="true"></div>
    </div>

    <!-- P2: compact icon-chip HUD -->
    <header class="hud" aria-label="資源列">
      <div class="hud-level" title="等級">
        <span class="hud-avatar" aria-hidden="true"></span>
        <span class="hud-lv">1</span>
      </div>
      <div class="hud-chips">
        <div class="chip energy" title="能量">
          <span class="chip-ico">⚡</span>
          <div class="chip-stack">
            <span id="energy-text" class="chip-val">100</span>
            <span id="energy-timer" class="chip-timer">已滿</span>
          </div>
          <button type="button" id="btn-energy-debug" class="chip-plus" title="試玩加能量" aria-label="加能量">⊕</button>
        </div>
        <div class="chip travel" title="旅費">
          <span class="chip-ico">✈️</span>
          <span id="travel-text" class="chip-val">0</span>
          <button type="button" id="btn-travel-plus" class="chip-plus" title="商店（未實裝）" aria-label="加旅費">⊕</button>
        </div>
        <div class="chip gems" title="寶石">
          <span class="chip-ico">💎</span>
          <span id="gems-text" class="chip-val">0</span>
          <button type="button" id="btn-gems-plus" class="chip-plus" title="商店（未實裝）" aria-label="加寶石">⊕</button>
        </div>
      </div>
      <button type="button" class="hud-mute" id="btn-mute" title="靜音" aria-label="靜音" aria-pressed="false">🔊</button>
      <button type="button" class="hud-shop" id="btn-shop" title="景點裝修" aria-label="景點裝修">🛒</button>
    </header>

    <nav class="landmarks-slim" id="landmarks" aria-label="景點進度"></nav>
    <button type="button" id="btn-decorate" class="btn-decorate" title="景點裝修" aria-label="景點裝修">裝修</button>

    <!-- P0: customers + bubbles ABOVE heads -->
    <section class="customers" aria-label="旅客訂單">
      <div id="orders" class="customer-row"></div>
      <div class="counter-ledge" aria-hidden="true"></div>
    </section>

    <!-- P1: wood board + floating dock (P4) -->
    <section class="board-stage">
      <div id="board" class="board" role="grid" aria-label="7×8 合併棋盤"></div>

      <!-- P4: generators + boost floating on board edge -->
      <div class="board-dock" id="board-dock" aria-label="生產器同渦輪">
        <!-- filled by renderDock() -->
      </div>
    </section>

    <!-- P4: detail strip — collapsed by default, expands on cell select -->
    <footer class="detail-strip" id="detail-strip" data-expanded="false" aria-label="選中物件詳情">
      <div class="detail-inner" id="detail-bar">
        <div class="detail-thumb" id="detail-thumb" hidden></div>
        <p id="detail-text" class="detail-hint">點選棋盤物件睇詳情</p>
      </div>
    </footer>

    <div id="fly-layer" class="fly-layer" aria-hidden="true"></div>
    <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
    <div id="toast" class="toast" hidden></div>
    <div id="reward-pop" class="reward-pop" hidden></div>
    
    <div id="decorate-modal" class="overlay decorate-overlay" hidden>
      <div class="decorate-card" role="dialog" aria-labelledby="decorate-title">
        <button type="button" id="btn-decorate-close" class="decorate-close" aria-label="關閉">×</button>
        <h2 id="decorate-title">景點裝修</h2>
        <p class="decorate-lead">用旅費解鎖下一個景點，或者裝修而家呢個——畫面會由灰變靚。</p>
        <div id="decorate-preview" class="decorate-preview" aria-hidden="true"></div>
        <div id="decorate-info" class="decorate-info"></div>
        <div class="decorate-actions">
          <button type="button" id="btn-unlock-next" class="btn-candy btn-unlock">解鎖下站</button>
          <button type="button" id="btn-upgrade-decor" class="btn-candy btn-upgrade">裝修亮燈</button>
        </div>
        <p id="decorate-hint" class="decorate-hint"></p>
      </div>
    </div>
    <div id="win-overlay" class="overlay" hidden>
      <div class="win-card">
        <div class="win-emoji"><img src="assets/lv10.png" alt="" width="48" height="48" onerror="this.src='assets/vehicles/lv10_airliner.svg'" /> 🗼</div>
        <h2>鐵塔首航成功！</h2>
        <p>第一章完結 — 載具進化幻想帶你去到埃菲爾鐵塔。</p>
        <p class="win-sub">下一程：萬里長城、金字塔、悉尼歌劇院……（未實裝）</p>
        <button type="button" id="btn-win-close" class="btn-candy">繼續玩</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
