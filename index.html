<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>環遊合併 — 載具進化幻想</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="phone-frame">
    <div id="app">
      <header class="top-bar">
        <div class="brand">
          <h1>環遊合併</h1>
          <p class="tagline">載具越強 · 去得越遠</p>
        </div>
        <div class="resources">
          <div class="pill energy" title="能量">
            <span class="pill-icon energy-bolt">⚡</span>
            <div class="pill-body">
              <span id="energy-text" class="pill-value">100/100</span>
              <span id="energy-timer" class="pill-sub">已滿</span>
            </div>
          </div>
          <div class="pill travel" title="旅費">
            <span class="pill-icon">✈️</span>
            <div class="pill-body">
              <span id="travel-text" class="pill-value">0</span>
              <span class="pill-sub">旅費</span>
            </div>
          </div>
          <div class="pill gems" title="寶石（裝飾）">
            <span class="pill-icon">💎</span>
            <div class="pill-body">
              <span class="pill-value">0</span>
              <span class="pill-sub">寶石</span>
            </div>
          </div>
          <button type="button" id="btn-energy-debug" class="btn-debug" title="試玩加能量">+10</button>
        </div>
      </header>

      <section class="passport" aria-label="護照印章進度">
        <div class="passport-label">🛂 護照印章</div>
        <div class="landmarks" id="landmarks"></div>
      </section>

      <section class="orders-strip">
        <div class="orders-head">
          <h2>旅客訂單</h2>
          <span class="orders-hint">交單賺旅費</span>
        </div>
        <div id="orders" class="orders"></div>
      </section>

      <section class="board-wrap">
        <div class="board-toolbar">
          <button type="button" id="generator" class="generator" title="零件堆">
            <span class="gen-emoji">🧰</span>
            <span class="gen-label">零件堆</span>
            <span id="gen-cost-badge" class="cost-badge yellow">⚡1</span>
          </button>
          <button type="button" id="btn-boost" class="boost-toggle" aria-pressed="false" title="渦輪：耗雙倍能量，出更高階">
            <span class="boost-icon">🚀</span>
            <span class="boost-text">
              <strong>x2 渦輪</strong>
              <small id="boost-hint">關閉</small>
            </span>
          </button>
        </div>
        <p class="tip" id="board-hint">拖兩個相同載具合併，或點一個再點另一個。</p>
        <div id="board" class="board" role="grid" aria-label="7×8 合併棋盤"></div>
      </section>

      <div id="toast" class="toast" hidden></div>
      <div id="win-overlay" class="overlay" hidden>
        <div class="win-card">
          <div class="win-emoji">🗼✈️</div>
          <h2>鐵塔首航成功！</h2>
          <p>第一章完結 — 載具進化幻想帶你去到埃菲爾鐵塔。</p>
          <p class="win-sub">下一程：萬里長城、金字塔、悉尼歌劇院……（未實裝）</p>
          <button type="button" id="btn-win-close" class="btn-candy">繼續玩</button>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
